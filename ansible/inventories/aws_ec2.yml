# Dynamic inventory for the terraform-aws-vpc-ec2 "dev" environment.
# ansible_host is set to the EC2 instance ID (not an IP) because the
# amazon.aws.aws_ssm connection plugin connects by instance ID over
# AWS Systems Manager Session Manager, not over the network.
plugin: amazon.aws.aws_ec2
regions:
  - ap-south-1
filters:
  tag:Project: terraform-aws-infrastructure
  tag:Environment: dev
  instance-state-name: running
hostnames:
  - tag:Name
compose:
  ansible_host: instance_id
keyed_groups:
  # tags.Role = "public" | "private" -> groups role_public / role_private
  - key: tags.Role
    prefix: role
