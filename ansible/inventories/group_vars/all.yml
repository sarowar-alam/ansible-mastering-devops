# Connect to every host purely via AWS Systems Manager Session Manager -
# no SSH keys, no inbound security-group rules required.
# Lives here (not ansible/group_vars/) because Ansible only auto-loads
# group_vars adjacent to the INVENTORY file or the PLAYBOOK file - a
# project-root group_vars/ is silently ignored by ansible-playbook (it only
# got picked up by ad-hoc `ansible -m ping` because that uses CWD as basedir).
# ansible_aws_ssm_bucket_name must be created first by
# scripts/prepare-aws-prereqs.sh (the plugin requires an S3 bucket even for
# shell/command modules - it ships the module code itself via S3).
ansible_connection: amazon.aws.aws_ssm
ansible_aws_ssm_region: ap-south-1
ansible_aws_ssm_bucket_name: ansible-ssm-transfer-388779989543-ap-south-1
ansible_python_interpreter: /usr/bin/python3
