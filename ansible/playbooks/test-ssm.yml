---
# Smoke test run via AWS Systems Manager Run Command
# (AWS-ApplyAnsiblePlaybooks), which executes `ansible-playbook -i
# "localhost," -c local` AS ROOT directly on the target - confirms Run
# Command reachability and basic fact gathering before any patch/config
# playbook is run (see scripts/run-ansible.sh).
- name: Verify Run Command reachability to private servers
  hosts: all
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml

  tasks:
    - name: Ping the target
      ansible.builtin.ping:

    - name: Show OS release detected on the target
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} -> {{ ansible_facts['distribution'] }}
          {{ ansible_facts['distribution_version'] }} ({{ ansible_facts['distribution_release'] }})

    - name: Retrieve the remote hostname
      ansible.builtin.command: hostname
      register: remote_hostname
      changed_when: false

    - name: Report remote hostname
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: remote hostname reported as {{ remote_hostname.stdout }}"
