---
# Full configuration sequence for private servers: patch -> utilities ->
# docker -> verify. Each stage is taggable so it can be run independently,
# e.g.:
#   ansible-playbook playbooks/site.yml --tags patch
#   ansible-playbook playbooks/site.yml --tags utilities
#   ansible-playbook playbooks/site.yml --tags docker
#
# Runs via AWS Systems Manager Run Command (AWS-ApplyAnsiblePlaybooks), which
# executes `ansible-playbook -i "localhost," -c local` AS ROOT directly on
# the target - no connection plugin, no become needed. See
# scripts/run-ansible.sh and README.md "How playbooks run".
- name: Configure private servers (patch, utilities, docker)
  hosts: all
  vars_files:
    - ../group_vars/all.yml

  roles:
    - role: patch
      tags: [patch]
    - role: common
      tags: [utilities, common]
    - role: docker
      tags: [docker]

- name: Verify final state of private servers
  hosts: all
  vars_files:
    - ../group_vars/all.yml
  tags: [verify]

  tasks:
    - name: Check docker is installed and active
      ansible.builtin.command: docker --version
      register: docker_check
      changed_when: false
      failed_when: false

    - name: Check common utilities (git) are installed
      ansible.builtin.command: git --version
      register: git_check
      changed_when: false
      failed_when: false

    - name: Report final verification
      ansible.builtin.debug:
        msg:
          - "{{ inventory_hostname }}: {{ git_check.stdout | default('git NOT FOUND') }}"
          - "{{ inventory_hostname }}: {{ docker_check.stdout | default('docker NOT FOUND') }}"
