[defaults]
inventory          = ./inventories/aws_ec2.yml
roles_path         = ./roles
host_key_checking  = False
stdout_callback    = ansible.builtin.default
interpreter_python = auto_silent
nocows             = 1
retry_files_enabled = False
# Silences noisy upstream collection deprecation notices (e.g. amazon.aws
# 'tags' host variable rename) once the underlying code is already migrated.
deprecation_warnings = False

[inventory]
enable_plugins = amazon.aws.aws_ec2, auto
