---
- name: Install Docker prerequisite packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
  tags: [docker]

- name: Ensure /etc/apt/keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  tags: [docker]

- name: Download Docker's official GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  tags: [docker]

- name: Add the Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ docker_apt_suite }} stable
    filename: docker
    state: present
    update_cache: true
  tags: [docker]

- name: Install Docker Engine, CLI, containerd, and plugins
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
  notify: restart docker
  tags: [docker]

- name: Ensure Docker service is enabled and started
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
  tags: [docker]

- name: Add the ubuntu user to the docker group
  ansible.builtin.user:
    name: ubuntu
    groups: docker
    append: true
  when: docker_add_ubuntu_user_to_group | bool
  tags: [docker]

- name: Verify Docker CLI version
  ansible.builtin.command: docker --version
  register: docker_version_check
  changed_when: false
  tags: [docker]

- name: Verify Docker service is active
  ansible.builtin.command: systemctl is-active docker
  register: docker_active_check
  changed_when: false
  tags: [docker]

- name: Report Docker verification result
  ansible.builtin.debug:
    msg: "{{ docker_version_check.stdout }} | service: {{ docker_active_check.stdout }}"
  tags: [docker]
