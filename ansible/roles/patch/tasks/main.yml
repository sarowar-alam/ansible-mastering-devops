---
- name: Update apt package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 0
  tags: [patch]

- name: Upgrade all packages to the latest version
  ansible.builtin.apt:
    upgrade: dist
    autoremove: true
    autoclean: true
  tags: [patch]

- name: Check whether a reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required_file
  tags: [patch]

- name: Report reboot status
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }}: reboot required = {{ reboot_required_file.stat.exists }}"
  tags: [patch]

- name: Reboot the host (only if required AND explicitly enabled)
  ansible.builtin.reboot:
    reboot_timeout: "{{ reboot_timeout }}"
    msg: "Rebooting after patch - triggered by Ansible (reboot_if_required=true)"
  when:
    - reboot_required_file.stat.exists
    - reboot_if_required | bool
  tags: [patch]
